# Comando: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # ============================================
  # Infraestructura
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: meal-tracker-postgres
    restart: unless-stopped
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - meal-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meal-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meal-tracker-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq: 
    image: rabbitmq:3-management-alpine
    container_name: meal-tracker-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: 
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - meal-tracker-network

  # ============================================
  # Microservicios (con hot-reload)
  # ============================================
  auth-service:
    image: node:20-alpine
    container_name: meal-tracker-auth-service
    working_dir: /app
    command: sh -c "npm install && npm run start:dev auth-service"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "true"
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRATION: 24h
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password
      SMTP_FROM: noreply@mealtracker.com
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meal-tracker-network

  api-gateway:
    image: node:20-alpine
    container_name: meal-tracker-api-gateway
    working_dir: /app
    command: sh -c "npm install && npm run start:dev api-gateway"
    environment:
      PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - auth-service
    networks:
      - meal-tracker-network

networks: 
  meal-tracker-network:
    driver: bridge

volumes: 
  postgres-data:
  rabbitmq-data:
  redis-data: